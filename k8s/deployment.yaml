apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-service
  namespace: task-manager
  labels:
    app: task-manager
spec:
  # 作业要求：2 个副本
  replicas: 2
  selector:
    matchLabels:
      app: task-manager
  template:
    metadata:
      labels:
        app: task-manager
    spec:
      # ghcr.io 私有镜像拉取凭证（kubectl create secret 创建，见 k8s/README.md）
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: task-service
          # CI 推送后由 deploy 阶段 kubectl set image 覆盖为 <sha> 版本
          image: ghcr.io/lcarusr/task-manager-api:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: task-manager-config
          # 作业要求：CPU 100m-200m, Memory 128Mi-256Mi
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          # 健康探针：Liveness（容器存活）+ Readiness（流量就绪）
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
