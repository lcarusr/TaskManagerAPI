name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  # Docker 镜像名必须全小写：ghcr.io/lcarusr/task-manager-api:<sha>
  # 镜像名与仓库名（lcarusr/TaskManagerAPI）解耦，符合作业要求的镜像 tag 规范
  IMAGE_NAME: ${{ github.repository_owner }}/task-manager-api

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      # 用 setup-go 的 go1.26 现场编译 golangci-lint，避免预编译二进制
      # 的 Go 版本低于 go.mod 目标（go1.25.7）导致 "used to build golangci-lint is lower" 报错
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8
      - name: Run golangci-lint
        run: golangci-lint run --timeout=5m ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Run tests
        # 覆盖率统计业务包（biz/data/service/server），排除纯生成的 conf.pb.go 与 main 入口
        run: go test -race -coverprofile=coverage.out ./internal/biz/... ./internal/data/... ./internal/service/... ./internal/server/...
      - name: Coverage gate (>= 60%)
        run: |
          total=$(go tool cover -func=coverage.out | tail -1 | awk '{print $NF}' | tr -d '%')
          echo "total coverage: ${total}%"
          if [ "$(echo "$total < 60" | bc)" -eq 1 ]; then
            echo "::error::coverage ${total}% is below the 60% threshold"
            exit 1
          fi

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Compile
        run: go build ./...
      - name: Build docker image
        run: docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} .

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build image for scan
        run: docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} .
      - name: Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

  push:
    name: Push image
    runs-on: ubuntu-latest
    needs: [ build, security-scan ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  deploy:
    name: Deploy to cluster
    runs-on: ubuntu-latest
    needs: push
    # 仅 main push 触发；KUBE_CONFIG 未配置时在 step 内跳过，保持 CI 绿色
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
      - name: Deploy to cluster
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          if [ -z "$KUBE_CONFIG" ]; then
            echo "::warning::KUBE_CONFIG secret is not configured, skipping deployment"
            exit 0
          fi
          mkdir -p "$HOME/.kube"
          echo "$KUBE_CONFIG" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          # kubectl apply -f k8s/ 按字母序应用，namespace 排在最后会导致
          # configmap/deployment/ingress 报 "namespaces not found"，故先单独 apply
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/
          kubectl set image deployment/task-service \
            task-service=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -n task-manager --record
          kubectl rollout status deployment/task-service -n task-manager
